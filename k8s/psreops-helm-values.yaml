hub:
  baseUrl: /
  config:
    JupyterHub:
      admin_access: true
      authenticator_class: oauthenticator.github.GitHubOAuthenticator
      log_level: INFO
    GitHubOAuthenticator:
      client_id: "Ov23li3d0tHX3y9fdSg9"
      client_secret: "463f75e4fcb0283de88c046cd7bc7966df8e776b"
      oauth_callback_url: https://psreops.ai/oauth_callback
      allowed_organizations:
        - techno-vet
      scope:
        - "read:user"
        - "user:email"
      auth_state_ttl: 3600
    KubeSpawner:
      default_url: /lab
      image_pull_policy: IfNotPresent

  extraConfig:
    psreops: |
      import os
      from oauthenticator.github import GitHubOAuthenticator
      from kubespawner import KubeSpawner
      
      class PsreOpsAuthenticator(GitHubOAuthenticator):
          """PsreOps GitHub OAuth authenticator with token injection"""
          
          async def pre_spawn_start(self, user, spawner):
              """Inject GitHub token and user info into spawned pod"""
              auth_model = await self.get_user_future(user)
              auth_state = await auth_model.get_auth_state()
              
              if auth_state and 'access_token' in auth_state:
                  spawner.environment['GH_TOKEN'] = auth_state['access_token']
                  spawner.environment['GITHUB_USER'] = user.name
                  spawner.environment['PSREOPS_TIER'] = 'standard'
              
              await super().pre_spawn_start(user, spawner)
      
      c.JupyterHub.authenticator_class = PsreOpsAuthenticator

proxy:
  service:
    type: LoadBalancer

singleuser:
  nodeSelector: {}
  uid: 1000
  fsGid: 100
