apiVersion: v1
kind: ConfigMap
metadata:
  name: psreops-templates
  namespace: prod-psreops
data:
  page.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>{% block title %}PsreOps{% endblock %}</title>
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        html, body {
          height: 100%;
        }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          color: #333;
          background: #f5f7fa;
        }
        a {
          color: #2a5298;
          text-decoration: none;
        }
        a:hover {
          text-decoration: underline;
        }
        button {
          font-family: inherit;
        }
      </style>
      {% block stylesheet %}{% endblock %}
    </head>
    <body>
      {% block main %}{% endblock %}
    </body>
    </html>

  login.html: |
    {% extends "page.html" %}

    {% block title %}
      PsreOps - SRE Operations Platform
    {% endblock %}

    {% block stylesheet %}
      {{ super() }}
      <style>
        body {
          background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          color: #333;
        }
        .login-container {
          background: white;
          border-radius: 12px;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
          max-width: 420px;
          width: 100%;
          padding: 40px;
          animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
          from {
            opacity: 0;
            transform: translateY(20px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        .logo-container {
          text-align: center;
          margin-bottom: 30px;
        }
        .logo-text {
          font-size: 32px;
          font-weight: 700;
          color: #1e3c72;
          margin: 0;
        }
        .logo-subtext {
          font-size: 12px;
          color: #666;
          text-transform: uppercase;
          letter-spacing: 2px;
          margin-top: 5px;
        }
        h1 {
          font-size: 24px;
          font-weight: 600;
          text-align: center;
          color: #1e3c72;
          margin: 30px 0 20px 0;
        }
        .login-form {
          display: flex;
          flex-direction: column;
          gap: 15px;
        }
        .form-group {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        label {
          font-size: 14px;
          font-weight: 500;
          color: #333;
        }
        input[type="text"],
        input[type="password"],
        select {
          padding: 12px 14px;
          border: 1px solid #ddd;
          border-radius: 6px;
          font-size: 14px;
          transition: all 0.3s ease;
          font-family: inherit;
        }
        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
          outline: none;
          border-color: #2a5298;
          box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }
        .login-button {
          background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
          color: white;
          border: none;
          padding: 12px 20px;
          border-radius: 6px;
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s ease;
          margin-top: 10px;
        }
        .login-button:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 20px rgba(30, 60, 114, 0.3);
        }
        .login-button:active {
          transform: translateY(0);
        }
        .login-button:disabled {
          opacity: 0.5;
          cursor: not-allowed;
        }
        .info-box {
          background: #f0f7ff;
          border-left: 4px solid #2a5298;
          padding: 15px;
          border-radius: 4px;
          margin-top: 20px;
          font-size: 13px;
          color: #555;
          line-height: 1.6;
        }
        .info-box strong {
          color: #1e3c72;
        }
      </style>
    {% endblock %}

    {% block main %}
    <div class="login-container">
      <div class="logo-container">
        <div class="logo-text">🚀 PsreOps</div>
        <div class="logo-subtext">SRE Operations Platform</div>
      </div>

      <h1>Login</h1>

      {% if message %}
        <div class="info-box" style="background: #ffe6e6; border-left-color: #d32f2f; color: #c62828;">
          {{ message }}
        </div>
      {% endif %}

      <form class="login-form" method="post" action="./login">
        {% if authenticator.enable_auth_state %}
          <input type="hidden" name="state" value="{{ state | e }}" />
        {% endif %}

        {% if auto_username %}
          <input type="hidden" name="username" value="{{ username }}" />
        {% else %}
          <div class="form-group">
            <label for="username">GitHub Username</label>
            <input
              type="text"
              name="username"
              id="username"
              placeholder="Enter your GitHub username"
              value="{{ username | e }}"
              autofocus
              required
            />
          </div>
        {% endif %}

        {% if authenticator.password_required %}
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>
        {% endif %}

        <button type="submit" class="login-button">
          Login with GitHub
        </button>
      </form>

      <div class="info-box">
        <strong>First time?</strong> Authenticate with your GitHub account. Make sure you have access to the techno-vet organization.
      </div>
    </div>
    {% endblock %}

  spawn.html: |
    {% extends "page.html" %}

    {% block title %}
      PsreOps - Select Your Environment
    {% endblock %}

    {% block stylesheet %}
      {{ super() }}
      <style>
        body {
          background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          color: #333;
          padding: 20px;
        }
        .spawn-container {
          max-width: 800px;
          width: 100%;
        }
        .header {
          text-align: center;
          color: white;
          margin-bottom: 40px;
        }
        .header h1 {
          font-size: 36px;
          margin: 0 0 10px 0;
          font-weight: 700;
        }
        .header p {
          font-size: 16px;
          opacity: 0.9;
          margin: 0;
        }
        .tier-cards {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
          gap: 20px;
          margin-bottom: 30px;
        }
        .tier-card {
          background: white;
          border-radius: 12px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
          overflow: hidden;
          transition: all 0.3s ease;
          cursor: pointer;
        }
        .tier-card:hover {
          transform: translateY(-8px);
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .tier-card.featured {
          border: 3px solid #2a5298;
          transform: scale(1.02);
        }
        .tier-card.featured:hover {
          transform: scale(1.02) translateY(-8px);
        }
        .tier-header {
          background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
          color: white;
          padding: 20px;
          text-align: center;
        }
        .tier-header h2 {
          margin: 0 0 5px 0;
          font-size: 24px;
          font-weight: 600;
        }
        .tier-header .badge {
          display: inline-block;
          background: rgba(255, 255, 255, 0.2);
          padding: 4px 12px;
          border-radius: 20px;
          font-size: 12px;
          text-transform: uppercase;
          letter-spacing: 1px;
        }
        .tier-body {
          padding: 30px 20px;
        }
        .tier-price {
          font-size: 28px;
          font-weight: 700;
          color: #1e3c72;
          margin-bottom: 15px;
        }
        .tier-price small {
          font-size: 14px;
          color: #666;
          font-weight: 400;
        }
        .tier-description {
          color: #666;
          font-size: 14px;
          margin-bottom: 20px;
          line-height: 1.6;
        }
        .tier-features {
          list-style: none;
          padding: 0;
          margin: 0 0 25px 0;
        }
        .tier-features li {
          padding: 8px 0;
          color: #555;
          font-size: 14px;
          border-bottom: 1px solid #f0f0f0;
        }
        .tier-features li:before {
          content: "✓ ";
          color: #2a5298;
          font-weight: 600;
          margin-right: 8px;
        }
        .tier-features li:last-child {
          border-bottom: none;
        }
        .tier-button {
          width: 100%;
          padding: 12px 20px;
          border: none;
          border-radius: 6px;
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s ease;
        }
        .tier-button.primary {
          background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
          color: white;
        }
        .tier-button.primary:hover {
          transform: translateY(-2px);
          box-shadow: 0 10px 20px rgba(30, 60, 114, 0.3);
        }
        .tier-button.secondary {
          background: #f0f0f0;
          color: #333;
          border: 1px solid #ddd;
        }
        .tier-button.secondary:hover {
          background: #e8e8e8;
        }
        .tier-card.featured .tier-button.secondary {
          background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
          color: white;
          border: none;
        }
      </style>
    {% endblock %}

    {% block main %}
    <div class="spawn-container">
      <div class="header">
        <h1>🚀 Launch PsreOps</h1>
        <p>Select your environment tier to get started</p>
      </div>

      <div class="tier-cards">
        <div class="tier-card">
          <div class="tier-header">
            <h2>Free</h2>
            <div class="badge">Community</div>
          </div>
          <div class="tier-body">
            <div class="tier-price">$0<small>/month</small></div>
            <p class="tier-description">Perfect for learning and small projects</p>
            <ul class="tier-features">
              <li>Full SRE dashboard access</li>
              <li>Pod management</li>
              <li>GitHub integration</li>
              <li>Community support</li>
              <li>1 concurrent pod</li>
            </ul>
            <form method="post" action="{{ url_prefix }}spawn" style="display: inline; width: 100%;">
              <input type="hidden" name="tier" value="free" />
              <button type="submit" class="tier-button secondary">
                Choose Free
              </button>
            </form>
          </div>
        </div>

        <div class="tier-card featured">
          <div class="tier-header">
            <h2>Professional</h2>
            <div class="badge">Recommended</div>
          </div>
          <div class="tier-body">
            <div class="tier-price">$49<small>/month</small></div>
            <p class="tier-description">For serious SRE operations and teams</p>
            <ul class="tier-features">
              <li>Everything in Free, plus:</li>
              <li>Advanced pod orchestration</li>
              <li>Priority support</li>
              <li>5 concurrent pods</li>
              <li>Advanced monitoring</li>
              <li>Custom domains</li>
            </ul>
            <form method="post" action="{{ url_prefix }}spawn" style="display: inline; width: 100%;">
              <input type="hidden" name="tier" value="professional" />
              <button type="submit" class="tier-button primary">
                Choose Professional
              </button>
            </form>
          </div>
        </div>

        <div class="tier-card">
          <div class="tier-header">
            <h2>Enterprise</h2>
            <div class="badge">Premium</div>
          </div>
          <div class="tier-body">
            <div class="tier-price">Custom<small>/month</small></div>
            <p class="tier-description">Unlimited power for large organizations</p>
            <ul class="tier-features">
              <li>Unlimited pods and resources</li>
              <li>Dedicated support</li>
              <li>SLA guarantee</li>
              <li>Custom integrations</li>
              <li>White-label options</li>
            </ul>
            <form method="post" action="{{ url_prefix }}spawn" style="display: inline; width: 100%;">
              <input type="hidden" name="tier" value="enterprise" />
              <button type="submit" class="tier-button secondary">
                Contact Sales
              </button>
            </form>
          </div>
        </div>
      </div>

      <div style="text-align: center; color: white; font-size: 14px;">
        <p>Not sure? Start with Free and upgrade anytime.</p>
      </div>
    </div>
    {% endblock %}

  launcher.html: |
    {% extends "page.html" %}

    {% block title %}
      PsreOps - Launcher
    {% endblock %}

    {% block stylesheet %}
      {{ super() }}
      <style>
        body {
          background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          color: #333;
          min-height: 100vh;
          padding: 40px 20px;
        }
        .launcher-container {
          max-width: 1200px;
          margin: 0 auto;
        }
        .launcher-header {
          text-align: center;
          color: white;
          margin-bottom: 50px;
        }
        .launcher-header h1 {
          font-size: 40px;
          margin: 0 0 15px 0;
          font-weight: 700;
        }
        .launcher-header p {
          font-size: 18px;
          opacity: 0.9;
          margin: 0;
        }
        .launcher-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
          gap: 25px;
        }
        .launcher-card {
          background: white;
          border-radius: 12px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
          overflow: hidden;
          transition: all 0.3s ease;
          text-decoration: none;
          color: inherit;
          display: flex;
          flex-direction: column;
        }
        .launcher-card:hover {
          transform: translateY(-8px);
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .launcher-icon {
          font-size: 48px;
          padding: 30px;
          text-align: center;
          background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
          border-bottom: 2px solid #2a5298;
        }
        .launcher-content {
          padding: 25px;
          flex: 1;
          display: flex;
          flex-direction: column;
        }
        .launcher-title {
          font-size: 18px;
          font-weight: 600;
          color: #1e3c72;
          margin: 0 0 10px 0;
        }
        .launcher-description {
          font-size: 14px;
          color: #666;
          margin: 0 0 20px 0;
          flex: 1;
          line-height: 1.6;
        }
        .launcher-button {
          background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
          color: white;
          border: none;
          padding: 12px 20px;
          border-radius: 6px;
          font-size: 14px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s ease;
          align-self: flex-start;
          text-decoration: none;
        }
        .launcher-button:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 15px rgba(30, 60, 114, 0.3);
        }
      </style>
    {% endblock %}

    {% block main %}
    <div class="launcher-container">
      <div class="launcher-header">
        <h1>🚀 PsreOps Launcher</h1>
        <p>Your environment is ready. Select an option to continue.</p>
      </div>

      <div class="launcher-grid">
        <div class="launcher-card">
          <div class="launcher-icon">📊</div>
          <div class="launcher-content">
            <h3 class="launcher-title">Dashboard</h3>
            <p class="launcher-description">Access the main SRE operations dashboard with monitoring and controls.</p>
            <a href="../../../user/{{ user.name }}/" class="launcher-button">Open Dashboard</a>
          </div>
        </div>

        <div class="launcher-card">
          <div class="launcher-icon">📚</div>
          <div class="launcher-content">
            <h3 class="launcher-title">Documentation</h3>
            <p class="launcher-description">Learn how to use PsreOps with guides, tutorials, and API reference.</p>
            <a href="https://docs.psreops.ai" class="launcher-button">Read Docs</a>
          </div>
        </div>

        <div class="launcher-card">
          <div class="launcher-icon">💬</div>
          <div class="launcher-content">
            <h3 class="launcher-title">Support</h3>
            <p class="launcher-description">Get help from our support team or join our community chat.</p>
            <a href="https://support.psreops.ai" class="launcher-button">Get Help</a>
          </div>
        </div>
      </div>
    </div>
    {% endblock %}
